name: Publish Image

# Builds and pushes the multi-arch image to GHCR whenever a GitHub Release is
# published — by release-please or manually. Decoupled from release-please's
# own internal state so any published release triggers it.
#
# The image is built once for amd64 and put through this repo's own test.sh
# before anything is pushed. Publishing an artifact that has never been started
# is the failure worth spending two minutes of runner time to avoid.

on:
  # A release published by release-please runs under GITHUB_TOKEN, and GitHub
  # deliberately does not fire workflows from GITHUB_TOKEN events — so this
  # trigger alone never ran. release.yml now calls this workflow directly via
  # workflow_call; the release trigger stays for releases cut by a human.
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.0.0).
        required: true
        type: string

permissions:
  contents: read

env:
  # GHCR links a package to its repository via
  # org.opencontainers.image.source in the Dockerfile — check that label is
  # this repo before the first release, or the package attaches elsewhere.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to ghcr.io
      # Keyless signing. cosign trades this OIDC token for a short-lived
      # Fulcio certificate, so there is no private key to store or rotate —
      # the identity in the signature is this workflow file at this ref.
      id-token: write
      attestations: write # SLSA provenance attached to the pushed digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version (strip leading v)
        id: ver
        env:
          TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The four scanner versions are build args, and the Makefile is what
      # normally supplies them. A plain `docker build` silently falls back to
      # the Dockerfile's ARG defaults — publishing an image pinned to
      # different versions than the repo says it ships.
      - name: Load pinned scanner versions as build args
        id: pins
        run: |
          {
            echo 'args<<EOF'
            grep -E '^[A-Z_]+=' versions.env
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "--- publishing with:"
          grep -E '^[A-Z_]+=' versions.env

      # Single-arch, loaded into the local daemon, so test.sh can actually run
      # it. buildx caches the layers, so the multi-arch build below reuses this
      # work for amd64 rather than repeating it.
      - name: Build amd64 for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci-test
          build-args: ${{ steps.pins.outputs.args }}

      # All four tools respond, and syft produces a real SBOM for a live image.
      # Needs network for the scanner databases.
      - name: Smoke test
        run: ./test.sh "${{ env.IMAGE }}:ci-test"

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: ${{ steps.pins.outputs.args }}
          # In-toto SLSA provenance for the build itself, max mode so the
          # materials and the build command are in it rather than just the
          # builder's name.
          provenance: mode=max
          sbom: true

      # This image ships cosign so users can verify other people's artifacts.
      # Shipping it unsigned was the one supply-chain claim the repo could not
      # make about itself.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # By digest, never by tag: a tag is mutable, so a signature attached
          # to one says nothing about the bytes a later puller receives.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attach SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A signing path that quietly stops working is worse than none, because
      # the docs keep telling people to verify. Verify what was just pushed,
      # with the same command the README gives users, and fail the release if
      # it does not come back clean.
      - name: Verify the signature and the provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "signature OK"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "provenance OK"

      - name: Build and push the -db variant
        id: build_db
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}-db
            ${{ env.IMAGE }}:latest-db
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
            BUILD_DATE=${{ steps.ver.outputs.built }}
          provenance: mode=max
          sbom: true

      - name: Sign the -db digest
        env:
          DIGEST: ${{ steps.build_db.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
