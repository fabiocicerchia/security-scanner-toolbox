name: Refresh bundled databases

# The -db tag exists for air-gapped scanning, which means the database in the
# image is the database you get. It ages from the moment it is built, and a
# vulnerability scanner running on a six-month-old feed is worse than none —
# it reports clean and everyone believes it.
#
# So: rebuild weekly. Only the databases change. The tool versions come from
# the published base image by digest, so this job cannot quietly move trivy or
# grype to a version the repo does not say it ships — that is what versions.env
# and a tagged release are for.

on:
  schedule:
    # Monday 03:17 UTC. Off the hour because every scheduled job on GitHub
    # fires at :00 and the runner queue shows it.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      base_tag:
        description: Base image tag to layer the databases onto.
        required: false
        default: latest
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the tag to a digest and build against that. A tag could move
      # between this step and the build; a digest cannot, so the -db image is
      # provably the tools from one specific published release plus data.
      - name: Resolve the base image digest
        id: base
        env:
          BASE_TAG: ${{ inputs.base_tag || 'latest' }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:${BASE_TAG}" \
            --format '{{ .Manifest.Digest }}')"
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # The version tag the refreshed image should also carry, read from
          # the base image rather than from the checkout, so a rebuild of an
          # older base does not get labelled with today's version.
          echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "building on ${IMAGE}@${digest}"

      # Single-arch first so the offline test can actually run it. buildx
      # caches, so the multi-arch push below reuses this for amd64.
      - name: Build amd64 for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.db
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:db-ci-test
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
            BUILD_DATE=${{ steps.base.outputs.built }}

      # The database download in Dockerfile.db fails the build if either feed
      # is absent, so reaching this step already means both landed. This proves
      # the stronger thing: with the network switched off, both scanners still
      # find real CVEs. An image that scanned clean offline would be the exact
      # silent failure this schedule exists to prevent.
      - name: Prove it scans with no network
        run: |
          ./test.sh "${IMAGE}:db-ci-test"
          ./test-offline.sh "${IMAGE}:db-ci-test"

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.base.outputs.version }}-db
            ${{ env.IMAGE }}:latest-db
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
            BUILD_DATE=${{ steps.base.outputs.built }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign and verify the refreshed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "signature OK"

      - name: Report what shipped
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Databases refreshed"
            echo
            echo '```'
            docker run --rm --network none "${IMAGE}:db-ci-test" 'cat /opt/scanner-db/VERSIONS'
            echo '```'
            echo
            echo "Base: \`${{ steps.base.outputs.ref }}\`"
            echo "Pushed: \`${IMAGE}@${DIGEST}\`"
            echo
            # What the databases cost. The docs point here rather than quoting
            # a number that goes stale every time a feed grows.
            base_size=$(docker image inspect "${{ steps.base.outputs.ref }}" \
              --format '{{ .Size }}' 2>/dev/null || echo 0)
            db_size=$(docker image inspect "${IMAGE}:db-ci-test" --format '{{ .Size }}')
            echo "| image | size |"
            echo "| --- | --- |"
            echo "| base | $(numfmt --to=iec "${base_size}") |"
            echo "| -db  | $(numfmt --to=iec "${db_size}") |"
          } >> "$GITHUB_STEP_SUMMARY"
