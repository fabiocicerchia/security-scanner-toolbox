# Domain vocabulary the typos dictionary mistakes for misspellings.

[files]
# CHANGELOG.md is generated by release-please and embeds a commit SHA per entry.
# Hex spells words: a recent one contains `ba`, reported as "should be by, be".
extend-exclude = ["CHANGELOG.md"]

[default.extend-words]
# "criticals" — how scanner output counts CRITICAL-severity findings.
criticals = "criticals"
