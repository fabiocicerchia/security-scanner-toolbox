# Scan a built image and keep the SBOM, as a required check.
#
# Copy to .github/workflows/scan.yml in the repo being scanned.
name: scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # Pinned tag, not :latest — a compliance gate whose contents change
    # between runs is not a gate.
    container: fabiocicerchia/security-scanner-toolbox:0.1.0
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Scanning from a registry needs no Docker socket. If you build locally
      # instead, push first and scan the pushed tag — mounting the socket into
      # a container running as uid 10001 is the harder path.
      - name: scan
        run: |
          scan-image "${IMAGE}" --fail-on high --sbom sbom.cdx.json
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

      # `always()` matters: the SBOM is most useful on the run that failed.
      # yamllint disable-line rule:line-length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json
